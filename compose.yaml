services:
  backend:
    image: standalone1-baseline-backend:ch01-v1
    build: ./backend
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 3s
      timeout: 2s
      retries: 20
  frontend:
    image: standalone1-baseline-frontend:ch01-v1
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-25510}:5173"
    volumes:
      - ./frontend:/workspace
      - frontend_deps:/workspace/node_modules
    depends_on:
      backend:
        condition: service_healthy
volumes:
  frontend_deps:
